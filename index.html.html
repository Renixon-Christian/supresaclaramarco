<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Crônicas de Hyrule 2D: Marco &amp; Clara</title>
<style>
:root{--g1:#f0d38a;--g2:#c99a3e;--g3:#6e4a10;--glass:rgba(10,8,22,.78);--edge:rgba(255,255,255,.16);--txt:#f4eeff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#050310;color:var(--txt);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:480px;display:flex;flex-direction:column;background:#000;overflow:hidden}
#wrap.shake #stage{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
#stage{position:relative;flex:0 0 auto;margin:0 auto;background:#000;overflow:hidden}
#stage.memory #cv{filter:sepia(.9) brightness(.8) contrast(1.1)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 6px 0;pointer-events:none;gap:6px}
#hud>*{pointer-events:auto}
#hearts{background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;font-size:16px;letter-spacing:1px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 12px #0008}
#hearts.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.2)}}
.hb{background:var(--glass);border:1px solid var(--edge);color:#fff;border-radius:50%;width:36px;height:36px;padding:0;font-size:17px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 12px #0008;font-family:inherit}
.rt{display:flex;gap:6px;margin-left:auto}
#who{padding:0;overflow:hidden;border:2px solid var(--g2)}
#who img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#obj{position:absolute;left:8px;right:8px;top:48px;text-align:center;font-size:12px;line-height:1.3;color:#ffe9a8;background:rgba(10,8,22,.7);border:1px solid rgba(240,211,138,.35);border-radius:10px;padding:5px 8px;pointer-events:none;display:none}
#bossbar{position:absolute;left:12px;right:12px;bottom:8px;display:none;gap:8px}
.bb{flex:1;height:10px;border-radius:6px;background:#000a;border:1px solid var(--edge);overflow:hidden}
.bb i{display:block;height:100%;width:100%;transition:width .2s}
.bb.r i{background:linear-gradient(90deg,#ff3b4a,#a0101e)}
.bb.b i{background:linear-gradient(90deg,#4ad0ff,#1a50c0)}
#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:88%;text-align:center;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;font-size:13px;z-index:35;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .6s}
#fade.on{opacity:1}
#pad{flex:1 1 auto;position:relative;min-height:140px;background:linear-gradient(#0c0820,#05030f);border-top:1px solid rgba(240,211,138,.4)}
#joy{position:absolute;left:0;top:0;bottom:0;width:60%;touch-action:none}
#jhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:2px dashed rgba(240,211,138,.22);display:flex;align-items:center;justify-content:center;color:rgba(240,211,138,.35);font-size:15px;letter-spacing:2px;pointer-events:none;text-align:center;line-height:1.4}
#jbase{position:absolute;width:104px;height:104px;border-radius:50%;border:2px solid rgba(240,211,138,.55);background:rgba(255,255,255,.07);display:none;pointer-events:none}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;left:29px;top:29px;background:radial-gradient(#ffe9a8,#c99a3e);box-shadow:0 0 14px rgba(240,211,138,.6)}
#btns{position:absolute;right:12px;top:0;bottom:0;display:flex;gap:14px;align-items:center}
.act{width:78px;height:78px;border-radius:50%;border:2px solid rgba(240,211,138,.8);background:radial-gradient(#7a5420,#2a1a06);color:#ffe9a8;font-size:30px;box-shadow:0 6px 16px #000a,inset 0 2px 6px rgba(255,255,255,.2);font-family:inherit;touch-action:none}
.act.small{width:56px;height:56px;font-size:22px;margin-top:-6px}
.act:active{transform:scale(.92);filter:brightness(1.3)}
.ov{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(4,2,16,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex}
.panel{background:linear-gradient(160deg,rgba(40,28,92,.9),rgba(14,10,40,.95));border:1px solid var(--edge);border-top:1px solid rgba(255,233,160,.5);border-radius:22px;padding:16px;width:92%;max-width:420px;text-align:center;max-height:96%;overflow:auto;box-shadow:0 20px 60px #000}
.panel h2{margin:0 0 6px;color:var(--g1);font-size:20px}
.panel p{margin:4px 0 12px;font-size:14.5px;color:#cfc6f5}
.big{background:linear-gradient(135deg,#ffe9a0,#e8b84a 55%,#9a6a14);color:#2a1604;border:0;border-radius:16px;font-size:20px;font-weight:bold;padding:14px 0;width:100%;font-family:inherit;letter-spacing:2px;box-shadow:0 8px 24px rgba(232,184,74,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.big:active{transform:scale(.97);filter:brightness(1.15)}
.score{margin-top:10px;font-size:13px;color:#b9afe6}
.bar{position:relative;height:42px;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;margin:14px 0 8px}
.zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#5cf0a0,#14a860);border-radius:8px;box-shadow:0 0 16px rgba(80,240,150,.7)}
.trap{position:absolute;top:0;bottom:0;border-radius:6px;background:repeating-linear-gradient(45deg,rgba(225,40,60,.9) 0 6px,rgba(110,10,30,.9) 6px 12px);box-shadow:0 0 14px rgba(255,50,80,.7)}
.mark{position:absolute;top:-5px;width:6px;height:52px;background:#fff;transform:translateX(-50%);box-shadow:0 0 12px #fff,0 0 26px #c99a3e;border-radius:3px}
.bar.good{border-color:#5f5}.bar.bad{border-color:#f55}
.timer{height:6px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c99a3e,#ff9a4a)}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;z-index:30;display:none;min-height:104px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--edge);border-top:1px solid rgba(255,233,160,.55);border-radius:20px;padding:14px 14px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.7)}
#dlg.on{display:block}
#dlg.hasp{padding-left:84px}
#dp{position:absolute;left:10px;bottom:10px;width:64px;height:86px;object-fit:cover;object-position:50% 8%;border-radius:12px;border:2px solid var(--g2);display:none;background:#000}
#dlg.hasp #dp{display:block}
#dn{position:absolute;top:-14px;left:16px;background:linear-gradient(135deg,#ffe9a0,#e8b84a 55%,#9a6a14);color:#2a1604;border-radius:999px;padding:3px 16px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;box-shadow:0 4px 12px rgba(232,184,74,.45)}
#dt{font-size:15.5px;line-height:1.45;min-height:64px;text-shadow:0 1px 2px #0009}
#dlg.narr #dt{font-style:italic;color:#d9d0ff}
#dar{position:absolute;right:14px;bottom:6px;color:var(--g2);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
#chs{position:absolute;left:10px;right:10px;bottom:10px;z-index:31;display:none;flex-direction:column;gap:8px}
#chs.on{display:flex}
.choice{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));color:#fff;border:1px solid var(--edge);border-left:4px solid var(--g2);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px rgba(0,0,0,.6);font-weight:600;font-size:15px;padding:13px 14px;text-align:left;font-family:inherit;line-height:1.3;background-color:rgba(10,8,22,.7)}
.choice:active{background:linear-gradient(135deg,rgba(255,213,74,.42),rgba(255,213,74,.14))}
#ctimer{height:7px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
#ctimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c99a3e,#ff3b5c)}
#qtext{background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;font-size:14.5px;text-align:center}
#start{z-index:70;background:radial-gradient(ellipse at 50% 30%,#2a1a3a,#05040c 72%);flex-direction:column;text-align:center;padding:24px;overflow:hidden}
#start::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(242,201,76,.1) 0 8deg,transparent 8deg 20deg);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#start>*{position:relative}
#start h1{font-size:36px;line-height:1.15;margin:0 0 6px;background:linear-gradient(180deg,#fff,#f0d38a 45%,#c99a3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 16px rgba(232,184,74,.55))}
#start .amp{-webkit-text-fill-color:#ff6b8a;filter:drop-shadow(0 0 14px #ff6b8a)}
#start p{color:#cdc6ff;margin:10px 0 26px;line-height:1.5;font-size:15px}
#start button{width:80%;max-width:300px}
#cards{z-index:55;background:radial-gradient(ellipse at 50% 20%,#2a1a3a,#05040c 78%);flex-direction:column;padding:14px}
#cards h2{margin:0 0 12px;color:var(--g1);font-size:18px;letter-spacing:3px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;width:100%}
.card{display:flex;flex-direction:column;align-items:center}
.card .fr{width:100%;aspect-ratio:3/4.4;border:1px solid var(--edge);border-top:1px solid rgba(255,233,160,.55);border-radius:16px;background:rgba(255,255,255,.06);box-shadow:0 10px 24px #000a;overflow:hidden}
.card .fr img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.card small{font-size:11px;text-align:center;margin-top:5px;line-height:1.2;font-weight:bold;color:#e9e2ff}
.tap{margin:18px 0 0;color:var(--g1);font-style:italic;animation:blink 1.2s infinite;text-align:center}
.howto{margin:14px 6px 0;font-size:12.5px;color:#cdc6ff;line-height:1.5;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
#titlecard{z-index:50;background:radial-gradient(ellipse at 50% 40%,#2a1636,#020106);flex-direction:column;text-align:center;padding:30px}
#titlecard h3{color:var(--g1);letter-spacing:4px;margin:0;font-size:15px;font-weight:normal}
#titlecard h1{font-size:25px;margin:14px 0 6px;line-height:1.25;background:linear-gradient(180deg,#fff,#f0d38a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#titlecard p{color:#aaa;font-style:italic;margin:0}
#over{z-index:60;background:radial-gradient(#5a0a1c,#08020a);flex-direction:column;text-align:center;padding:24px}
#over h1{color:#ff5a6a;letter-spacing:3px;font-size:24px;text-shadow:0 0 18px #f00;margin:8px 0}
#over p{color:#e8c8c8;font-style:italic;margin:6px 0 24px}
#final{z-index:65;background:linear-gradient(#b8532e,#6a1f3a 55%,#0c0620);flex-direction:column;padding:22px;overflow:auto;justify-content:flex-start}
#final .box{margin:auto 0;text-align:center}
#final p{font-size:16px;line-height:1.5;opacity:0;transition:opacity 1.6s;margin:0 0 16px;text-shadow:0 2px 4px #0008}
#final p.on{opacity:1}
#final p.q{font-weight:bold;color:#fff3c4;font-size:18px}
#final button{opacity:0;transition:opacity 1s}
#final button.on{opacity:1}
#inv ul{list-style:none;padding:0;margin:8px 0 14px;text-align:left}
#inv li{padding:8px 10px;border-bottom:1px solid #fff2;font-size:15px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="192" height="288"></canvas>
    <div id="hud"><div id="hearts"></div><button id="who" class="hb" style="display:none"></button><div class="rt"><button class="hb" id="invbtn">🎒</button><button class="hb" id="mutebtn">🔊</button></div></div>
    <div id="obj"></div>
    <div id="bossbar"><div class="bb r"><i></i></div><div class="bb b"><i></i></div></div>
    <div id="toast"></div>
  </div>
  <div id="pad">
    <div id="joy"><div id="jhint">◀ ▲<br>▼ ▶</div><div id="jbase"><div id="knob"></div></div></div>
    <div id="btns"><button class="act small" id="bB">⇄</button><button class="act" id="bA">⚔</button></div>
  </div>
  <div id="fade"></div>
  <div id="chs"></div>
  <div id="dlg"><img id="dp" alt=""><div id="dn"></div><div id="dt"></div><div id="dar">▼</div></div>
  <div id="mini" class="ov"></div>
  <div id="inv" class="ov"><div class="panel"><h2>🎒 Inventário Secreto</h2><ul id="invlist"></ul><button class="big" id="invclose">FECHAR</button></div></div>
  <div id="titlecard" class="ov"></div>
  <div id="over" class="ov"><div style="font-size:56px">💀</div><h1>A JORNADA SE ENCERRA...</h1><p>Os corações se esgotaram. Mas todo herói tenta de novo.</p><button class="big" id="retrybtn" style="max-width:300px">TENTAR A FASE DE NOVO</button></div>
  <div id="cards" class="ov"></div>
  <div id="final" class="ov"></div>
  <div id="start" class="ov on">
    <svg width="90" height="90" viewBox="0 0 100 100"><g stroke="#ffd54a" stroke-width="4" stroke-linecap="round"><path d="M50 6V16M50 84V94M6 50H16M84 50H94M18 18L25 25M82 18L75 25M18 82L25 75M82 82L75 75"/></g><circle cx="50" cy="50" r="28" fill="#ffd54a" stroke="#7a4a00" stroke-width="3"/><path d="M50 10 L57 58 L50 70 L43 58Z" fill="#e7eef7" stroke="#3a2410" stroke-width="2.5"/><rect x="34" y="58" width="32" height="7" rx="3" fill="#c08a1e" stroke="#3a2410" stroke-width="2.5"/><rect x="47" y="65" width="6" height="18" fill="#7a3b1a" stroke="#3a2410" stroke-width="2.5"/></svg>
    <h1>A Saga de<br>Marco <span class="amp">&amp;</span> Clara</h1>
    <div style="color:#c99a3e;letter-spacing:4px;font-size:13px;margin-top:-2px">CRÔNICAS DE HYRULE · AVENTURA 2D</div>
    <p>Edição Épica e Sombria<br>Explore, lute e viva a história de vocês.</p>
    <button class="big" id="startbtn">ENTRAR NO REINO</button>
  </div>
</div>

/* ============ minigame: barra de reação ============ */
function qte(q) {
  const id = G.runId; uiOn(); const mini = $("#mini");
  mini.innerHTML = `<div class="panel"><h2>${q.title}</h2><p>${q.hint}</p><div class="bar"><div class="zone"></div><div class="mark"></div></div><div class="timer"><i></i></div><button class="big" id="qbtn">${q.btn || "AGORA!"}</button><div class="score"></div></div>`;
  mini.classList.add("on");
  const bar = mini.querySelector(".bar"), zone = mini.querySelector(".zone"), mark = mini.querySelector(".mark"), tim = mini.querySelector(".timer i"), score = mini.querySelector(".score");
  const need = q.need, traps = q.traps || 0, limit = q.limit || 3, base = q.speed || 1.2;
  let round = 0, hits = 0, pos = 0, dir = 1, zl = 0, zw = 0.24, t0 = 0, last = performance.now(), raf = 0, busy = false;
  const stop = () => cancelAnimationFrame(raf);
  cleanups.push(stop);
  return new Promise((res, rej) => {
    function newRound() {
      mini.querySelectorAll(".trap").forEach(t => t.remove());
      zw = Math.max(0.14, 0.27 - round * 0.03); zl = 0.06 + Math.random() * (0.88 - zw);
      zone.style.left = zl * 100 + "%"; zone.style.width = zw * 100 + "%";
      const tz = [];
      for (let k = 0, tries = 0; k < traps && tries < 60; tries++) {
        const w = 0.1, l = 0.04 + Math.random() * (0.92 - w);
        if ((l + w < zl - 0.04 || l > zl + zw + 0.04) && tz.every(t => l + w < t[0] - 0.03 || l > t[0] + t[1] + 0.03)) { tz.push([l, w]); k++; }
      }
      tz.forEach(([l, w]) => { const d = document.createElement("div"); d.className = "trap"; d.style.left = l * 100 + "%"; d.style.width = w * 100 + "%"; bar.insertBefore(d, mark); });
      pos = Math.random(); dir = Math.random() < 0.5 ? 1 : -1; t0 = performance.now(); busy = false; bar.className = "bar";
      score.textContent = `Rodada ${round + 1}/${q.rounds} · Acertos ${hits}/${need} · Errar custa ❤️`;
    }
    function resolve(hit) {
      if (busy) return; busy = true;
      if (hit) { hits++; sfx.hit(); bar.classList.add("good"); } else { bar.classList.add("bad"); sfx.miss(); setHp(G.hp - 1); }
      round++;
      setTimeout(() => { if (id !== G.runId) return; if (round >= q.rounds) finish(); else newRound(); }, 480);
    }
    function finish() {
      cancelAnimationFrame(raf); cleanups = cleanups.filter(f => f !== stop); mini.classList.remove("on"); uiOff();
      const ok = hits >= need; if (!ok) setHp(G.hp - 1);
      if (id !== G.runId) { rej(new Abort()); return; } res(ok);
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!busy) {
        pos += dir * dt * (base + round * 0.2);
        if (pos >= 1) { pos = 1; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; }
        mark.style.left = pos * 100 + "%";
        const el = (now - t0) / 1000; tim.style.width = Math.max(0, 100 - el / limit * 100) + "%";
        if (el > limit) resolve(false);
      }
      raf = requestAnimationFrame(loop);
    }
    mini.querySelector("#qbtn").addEventListener("pointerdown", e => { e.preventDefault(); if (!busy) resolve(pos >= zl && pos <= zl + zw); });
    newRound(); raf = requestAnimationFrame(loop);
  });
}

/* ============ atualização ============ */
function updPlayer(dt) {
  const p = ctrlP(); p.cool = Math.max(0, p.cool - dt); G.invuln = Math.max(0, G.invuln - dt);
  const v = moveVec();
  if (p.kb > 0) { p.kb -= dt; moveE(p, p.kx * dt, p.ky * dt); }

    const sp = 58 * (p.atk > 0 ? 0.45 : 1);

    if (p.atk <= 0) p.dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x < 0 ? "left" : "right") : (v.y < 0 ? "up" : "down");
    p.wt += dt * 8; p.fr = [0, 1, 0, 2][Math.floor(p.wt) % 4];
    const l = G.trail[G.trail.length - 1];
    if (!l || Math.hypot(p.x - l.x, p.y - l.y) > 4) { G.trail.push({ x: p.x, y: p.y }); if (G.trail.length > 12) G.trail.shift(); }
  } else p.fr = 0;
  if (p.atk > 0) { p.atk -= dt; if (p.char === "marco" && !p.hitDone && p.atk < 0.16) { p.hitDone = true; doSlash(p); } }
}
function updFollower(dt) {

  const f = G.party[1 - G.ctrl], p = ctrlP(); if (f.goto) return;
  const n = G.trail.length; let tx = p.x, ty = p.y;
  if (n > 6) { tx = G.trail[n - 7].x; ty = G.trail[n - 7].y; }
  else if (dist(f, p) > 20) { const d = DV[p.dir]; tx = p.x - d.x * 16; ty = p.y - d.y * 16; }
  const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
  if (d > 2) {
    const s = Math.min(d / dt, 72); f.x += dx / d * s * dt; f.y += dy / d * s * dt;
    f.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
    f.wt += dt * 8; f.fr = [0, 1, 0, 2][Math.floor(f.wt) % 4];
  } else f.fr = 0;
  if (dist(f, p) > 90) { f.x = p.x; f.y = p.y; }
}
function updEnemy(e, dt) {
  const p = ctrlP(), d0 = ET[e.type]; e.t += dt; e.hit = Math.max(0, e.hit - dt);

    e.wt += dt * 8; e.fr = [0, 1, 0, 2][Math.floor(e.wt) % 4];
  } else {
    let vx, vy;
    if (d < d0.sense) {
      vx = dx / d * d0.sp; vy = dy / d * d0.sp;
      if (e.type === "wisp") { vx += Math.sin(e.t * 7) * 22; vy += Math.cos(e.t * 6) * 22; }
    } else {
      e.wander -= dt; if (e.wander <= 0) { e.wander = rr(0.8, 2); const a = Math.random() * 6.28; e.wx = Math.cos(a) * 0.5; e.wy = Math.sin(a) * 0.5; if (Math.random() < 0.3) e.wx = e.wy = 0; }

async function pizzaFest() {
  let got = 0, time = 18; const goal = 10, id = G.runId;
  const area = []; for (let y = 1; y <= 4; y++) for (let x = 5; x <= 13; x++) if (!SOLID.has(getT(G.map, x, y))) area.push([x, y]);

    if (G.ui || G.cut || id !== G.runId) return;
    for (const e of G.ents) if ((e.kind === "pizza" || e.kind === "bad") && e.exp < G.time) e.dead = true;
    if (G.ents.filter(e => e.kind === "pizza" || e.kind === "bad").length >= 6) return;
    const p = ctrlP(), [tx, ty] = area[Math.floor(Math.random() * area.length)];
    if (Math.hypot(tc(tx) - p.x, tc(ty) - p.y) < 20) return;
    const bad = Math.random() < 0.3;
    G.ents.push(ent({ k: "pickup", kind: bad ? "bad" : "pizza", x: tc(tx), y: tc(ty), hw: 6, hh: 6, exp: G.time + 4, onPick: bad ? null : () => { got++; } }));
  }, 450);
  const tk = setInterval(() => { if (G.ui || G.cut || id !== G.runId) return; time--; setObj(`Pizzas: ${got}/${goal} · Tempo: ${Math.max(0, time)}s · Evite os cogumelos 🍄`); }, 1000);
  cleanups.push(() => { clearInterval(sp); clearInterval(tk); });
  await freePlay(() => got >= goal || time <= 0);
  clearInterval(sp); clearInterval(tk);
  G.ents.forEach(e => { if (e.kind === "pizza" || e.kind === "bad") e.dead = true; }); setObj("");
  if (got >= goal) { sfx.fanfare(); await say(null, "Stamina lendária! O banquete foi completo e a energia vital do casal está restaurada."); }
  else { setHp(G.hp - 1); await say(null, "A barra de stamina não encheu por completo... o banquete custou um coração."); }
}

    for (let y = 8; y < 25; y++) { if (rng() < 0.4) setT(m, 1, y, TI.T); if (rng() < 0.4) setT(m, 14, y, TI.T); }
    const cr = [[3, 17, "Cristal da Infância"], [12, 12, "Cristal da Palestra"], [6, 9, "Cristal da Banca"]];
    cr.forEach(([x, y]) => { setT(m, x, y, TI.S); });
    const ents = cr.map(([x, y, n]) => ent({ k: "pickup", kind: "crystal", name: n, x: tc(x), y: tc(y), hw: 6, hh: 6, onPick: () => {
      G.flags.cr = (G.flags.cr || 0) + 1;
      if (G.flags.cr === 1) setObj("Cristais de Memória: 1/3");
      else if (G.flags.cr === 2) setObj("Cristais de Memória: 2/3");
      else runScript(async () => {
        setObj(""); const mc = G.party[0];
        await say("Clara", "Os três cristais brilham juntos! Antes do último ato, vem a Prova da Memória. Três perguntas, cavaleiro, e sem enrolar.");
        await ask("Qual foi o pretexto usado por Marco para convidar Clara ao Oásis?", [["Uma Palestra Mística de Conhecimento.", true], ["Um jantar à luz de velas.", false], ["Um passeio de barco.", false]], 9);
        await ask("Qual banca Clara citou no contra-feitiço da cantada?", [["A banca de heteroidentificação.", true], ["A banca de matemática.", false], ["A banca da Guarda Real.", false]], 9);
        await ask("Em que ano acontece o salto temporal desta saga?", [["2026.", true], ["2025.", false], ["2027.", false]], 9);
        await say("Clara", "Você passou na minha prova, cavaleiro. Agora venha ver o mar.");
        G.flags.quizDone = 1; setObj("Caminhe até a beira do mar, ao norte.");
      });
    } }));
    ents.push(spawnEnemy("sombra", 4, 15), spawnEnemy("sombra", 11, 13), spawnEnemy("brute", 7, 10), spawnEnemy("sombra", 10, 19), spawnEnemy("wisp", 5, 20), heartAt(8, 14));
    return {
      map: m, ents, party: [mkPC("marco", 8, 23), mkPC("clara", 7, 23)],
      trig: [{ x: 2, y: 7, w: 12, h: 1, when: () => G.flags.quizDone, run: async () => {
        await say(null, "O sol morre devagar no horizonte e pinta o céu com as cores de um incêndio controlado.");
        await say("Marco", "Dois anos, Clara. Parece uma profecia cumprida.");
        await say("Clara", "Quem diria que aquela briguinha de 3 anos viraria isso.");
        await say("Marco", "Quem apanha não esquece, né?");
        await say("Clara", "Não esquece mesmo. E ainda bem.");
        await say(null, "O vento salgado carrega o eco de todas as palavras não ditas. Mas eles estão juntos. E, por enquanto, isso basta.");
        await nextLevel();
      } }]
    };
  },
  async intro(retry) {
    if (!retry) {
      await title("CAPÍTULO IV|A Costa do Pôr do Sol em 2026", "Dois anos depois");
      await say(null, "Dois anos após o início da travessia, de batalhas, ausências e reencontros, o horizonte da Costa do Pôr do Sol reflete laranjas profundos, âmbar e violetas sobre o oceano.");
      await say(null, "Marco mantém seu porte altivo, com o manto agora mais gasto e mais honesto. Clara contempla o mar em silêncio. Mas a costa guarda cristais de memória, e as sombras os vigiam.");
    }
    setObj("Recupere os 3 Cristais de Memória espalhados pela costa.");
  }
};

/* ---------- Capítulo 5 ---------- */
LV[5] = {
  build() {
    const m = newMap(14, 24, TI.W, "ruin");
    fillR(m, 1, 2, 12, 21, TI.P);
    [[3, 8], [10, 8], [3, 15], [10, 15]].forEach(([x, y]) => setT(m, x, y, TI.K));
    fillR(m, 6, 11, 2, 2, TI.N); [[5, 6], [8, 6], [5, 18], [8, 18]].forEach(([x, y]) => setT(m, x, y, TI.N));
    [[1, 2], [12, 2], [1, 12], [12, 12], [1, 21], [12, 21]].forEach(([x, y]) => setT(m, x, y, TI.F));
    const ren = mkNPC("renixon", 7, 4, null, { dir: "down" });
    return {
      map: m, ents: [ren, heartAt(2, 19)], party: [mkPC("marco", 7, 21), mkPC("clara", 6, 21)],
      trig: [{ x: 1, y: 12, w: 12, h: 1, run: async () => {
        const r = G.ents.find(e => e.spr === "renixon");
        setObj("");
        await say("Renixon", "Os artefatos sheikah estão despertando. Algo antigo se move sob as ruínas de Necluda. E ele sente cada passo de vocês.");
        await say("Renixon", "Duas sombras gêmeas: a Rubra teme o aço, e a Azul teme a magia. Alternem entre espada e magia com ⇄.");
        G.shake = 0.7; sfx.boss(); r.dir = "down";
        await say(null, "O cristal no peito de Renixon se acende em azul. Duas sombras sobem das paredes e avançam contra o casal!");
        const a = spawnEnemy("twin", 4, 6, { col: "r", immune: "bolt", mhp: 6 }), b = spawnEnemy("twin", 10, 6, { col: "b", immune: "sword", mhp: 6 });
        setHp(G.maxhp); G.ents.push(a, b); G.boss = true; puff(a.x, a.y, "#ff4a5a", 30, 80); puff(b.x, b.y, "#4ad0ff", 30, 80);
        const hv = setInterval(() => { if (G.ui || G.cut || !G.boss) return; if (G.ents.filter(e => e.kind === "heart").length) return; const tx = 2 + Math.floor(Math.random() * 10), ty = 14 + Math.floor(Math.random() * 7); if (!SOLID.has(getT(G.map, tx, ty))) G.ents.push(heartAt(tx, ty)); }, 6000);
        cleanups.push(() => clearInterval(hv));
        setObj("Derrote as Sombras Gêmeas: espada ⚔ na Rubra, magia (⇄) na Azul");
        await freePlay(() => !aliveTag("twin") && !G.ents.some(e => e.type === "twin" && !e.dead));
        clearInterval(hv); G.boss = false; $("#bossbar").style.display = "none"; setObj("");
        G.ents = G.ents.filter(e => e.k !== "orb");
        addItem("Selo das Sombras Gêmeas");
        await say("Renixon", "O selo está quebrado. Mas lembrem-se: Fernanda Lorena não é mulher de lágrimas, e sim de cálculos. O reino ainda tentará separá-los com leis e títulos.");
        await say("Marco", "Então temos dois inimigos: um que usa coroas e outro que usa garras.");
        await say("Clara", "E temos um ao outro. E isso, Marco, é mais do que a maioria jamais terá.");
        await say(null, "Clara dá um último teste a Marco. Ele precisa jurar agora, sem hesitar.");
        const c = await choose([
          { t: "“Se o mundo nos separar, queime o mundo.”", hp: 1 },
          { t: "“Vamos negociar com Fernanda antes que seja tarde.”", hp: -1 },
          { t: "“Deixe as sombras comigo; você não precisa lutar.”", hp: -1 }
        ], { timed: 10, shuffle: true });
        if (c === 0) await say(null, "O juramento arde no ar. Não é um pacto de amor, mas de sobrevivência, selado com olhares.");
        else if (c === 1) await say("Clara", "Negociar? Eu esperava um juramento, cavaleiro.");
        else await say("Clara", "Eu não sou um tesouro a ser guardado, Marco.");
        const mc = G.party[0], cl = G.party[1];
        await say(null, "Naquela noite, sob a lua pálida de Mossoró, eles fizeram um novo pacto, selado com a certeza de que o mundo inteiro teria que passar por eles.");
        kiss((mc.x + cl.x) / 2, mc.y); await wait(1800);
        await nextLevel();
      } }]
    };
  },
  async intro(retry) {
    if (!retry) {
      await title("CAPÍTULO V|O Pacto das Sombras Gêmeas", "As ruínas de Necluda");
      await say(null, "Nas semanas seguintes ao Festim, Hyrule mergulhou numa quietude inquieta, do tipo que antecede tempestades. Fernanda Lorena, a nobre traída, tecia uma rede de influências nos salões gelados ao norte.");
      await say("Clara", "Eles vão tentar nos separar. Não com espadas, mas com leis, com títulos, com o peso de um reino que não perdoa quem escolhe o coração em vez do dever.");
      await say("Marco", "Então que venham as leis. Já enfrentei bancas, julgamentos e a fúria de deuses menores. Não vou recuar diante de uma nobre ressentida.");
      await say("Clara", "Cuidado com o que promete, cavaleiro. Renixon me procurou ontem. Ele nos espera nas ruínas.");
    }
    setObj("Avance pelas ruínas até Renixon, ao norte.");
  }
};

/* ============ final ============ */
function finale() {
  const f = $("#final"); started = true;
  f.innerHTML = `<div class="box">
  <p>Nem mesmo os pergaminhos da sorte ou as profecias do Reino poderiam prever que um pequeno desentendimento na infância, aos 3 anos de idade, se tornaria o início da nossa maior aventura, ou da nossa perdição mais doce. Enfrentamos os julgamentos das bancas mágicas, cruzamos os oásis iluminados pela lua sangrenta e hoje celebramos cada capítulo que escrevemos juntos, sabendo que cada um poderia ter sido o último.</p>
  <p>Marco, entre todos os caminhos e escolhas de Hyrule e do mundo real, entre todas as sombras que nos rondaram e todas as luzes que quase nos cegaram, escolher você continuará sendo a minha melhor e mais perfeita decisão todos os dias. Mesmo quando o mundo desabar. Mesmo quando a Triforce se partir.</p>
  <p class="q">Você ainda passa pela minha banca de heteroidentificação? Porque o seu coração já foi aprovado, selado e eu sou todinha sua, e nem a escuridão de Hyrule será capaz de apagar isso. ❤️✨</p>
  <p style="font-size:14px;letter-spacing:3px;color:#f0d38a">FIM DA SAGA, POR ENQUANTO.<br><i style="letter-spacing:0">Pois toda escuridão, eventualmente, encontra uma nova aurora.</i></p>
  <button class="big" id="again">JOGAR NOVAMENTE</button></div>`;
  $("#fade").classList.remove("on"); f.classList.add("on"); sfx.fanfare();
  const ps = f.querySelectorAll("p");
  ps.forEach((p, i) => setTimeout(() => { p.classList.add("on"); sfx.magic(); }, 800 + i * 4200));
  setTimeout(() => f.querySelector("button").classList.add("on"), 800 + ps.length * 4200);
  f.querySelector("button").addEventListener("pointerdown", () => location.reload());
}
/* ============ ligação de controles e início ============ */
function fit() {
  const wrap = $("#wrap"), st = $("#stage");
  const W = Math.min(wrap.clientWidth, 480), H = wrap.clientHeight - 150;
  const s = Math.min(W / VW, H / VH);
  st.style.width = Math.floor(VW * s) + "px"; st.style.height = Math.floor(VH * s) + "px";
}
addEventListener("resize", fit); fit();
addEventListener("keydown", e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === " " || k === "enter" || k === "z" || k === "j") pressA();
  else if (k === "x" || k === "k" || k === "shift") pressB();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
const joy = $("#joy"), jbase = $("#jbase"), knob = $("#knob"), jhint = $("#jhint");
let jid = null, jo = { x: 0, y: 0 };
joy.addEventListener("pointerdown", e => {
  jid = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (x) {}
  const r = joy.getBoundingClientRect(); jo.x = e.clientX; jo.y = e.clientY;
  jbase.style.display = "block"; jbase.style.left = (e.clientX - r.left - 52) + "px"; jbase.style.top = (e.clientY - r.top - 52) + "px";
  jhint.style.display = "none"; JV.x = JV.y = 0; ac();
});
joy.addEventListener("pointermove", e => {
  if (e.pointerId !== jid) return;
  let dx = e.clientX - jo.x, dy = e.clientY - jo.y; const d = Math.hypot(dx, dy), m = 38;
  if (d > m) { dx *= m / d; dy *= m / d; }
  JV.x = dx / m; JV.y = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
});
const jend = e => { if (e.pointerId !== jid) return; jid = null; JV.x = JV.y = 0; jbase.style.display = "none"; jhint.style.display = "flex"; knob.style.transform = ""; };
joy.addEventListener("pointerup", jend); joy.addEventListener("pointercancel", jend);
$("#bA").addEventListener("pointerdown", e => { e.preventDefault(); ac(); pressA(); });
$("#bB").addEventListener("pointerdown", e => { e.preventDefault(); pressB(); });
$("#who").addEventListener("pointerdown", e => { e.preventDefault(); pressB(); });
$("#dlg").addEventListener("pointerdown", e => { e.preventDefault(); advance(); });
$("#mutebtn").addEventListener("pointerdown", e => { e.stopPropagation(); muted = !muted; $("#mutebtn").textContent = muted ? "🔇" : "🔊"; });
$("#invbtn").addEventListener("pointerdown", e => {
  e.stopPropagation();
  $("#invlist").innerHTML = G.inv.length ? G.inv.map(i => `<li>✨ ${i}</li>`).join("") : "<li>Nenhum item ainda...</li>";
  $("#inv").classList.add("on");
});
$("#invclose").addEventListener("pointerdown", () => $("#inv").classList.remove("on"));
$("#retrybtn").addEventListener("pointerdown", () => { $("#over").classList.remove("on"); loadLevel(G.lv, true); });

function buildCards() {
  const heroes = [["marco", "Marco: O Cavaleiro Guardião"], ["clara", "Clara: A Princesa Encantada"], ["renixon", "Renixon: O Conselheiro"]];
  $("#cards").innerHTML = `<h2>⚜ GRIMÓRIO DOS HERÓIS ⚜</h2><div class="cgrid">` +
    heroes.map(([k, t]) => `<div class="card"><div class="fr"><img alt="" src="${IMG[k]}"></div><small>${t}</small></div>`).join("") +
    `</div><div class="howto">🕹️ <b>Arraste</b> na área esquerda para andar.<br>⚔ <b>Atacar</b> (Marco: espada · Clara: magia) e conversar com quem tem “!”.<br>⇄ <b>Alternar</b> entre Marco e Clara quando estiverem juntos.<br>❤️ Os corações são do casal: se acabarem, a fase recomeça.</div><p class="tap">Toque para começar a aventura</p>`;
}
$("#startbtn").addEventListener("pointerdown", () => {
  ac(); started = true; $("#start").classList.remove("on"); sfx.fanfare(); buildCards(); $("#cards").classList.add("on");
});
$("#cards").addEventListener("pointerdown", () => { $("#cards").classList.remove("on"); G.hp = 4; G.inv = []; loadLevel(0, false); });

let lastT = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  if (G.map) { try { update(dt); render(); } catch (e) { console.error(e); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
drawHearts();
window.__G = G;
window.__dbg = { loadLevel, LV };
window.__run = runScript;
</script>
